<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bonsai</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500&display=swap');
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(130% 100% at 50% 30%, #f3f6ee 0%, #e7ede0 60%, #dbe3d3 100%);
    color:#3c4a3a;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
  }
  .brand{ text-align:center; margin-bottom:6px; }
  .brand h1{ font-family:'Fraunces',serif; font-weight:600; font-size:1.9rem; color:#3a4736; }
  .brand p{ font-size:.86rem; color:#7c8b76; margin-top:4px; }

  .frame{
    width:min(440px, 92vw);
    filter: drop-shadow(0 24px 40px rgba(60,80,55,.14));
  }
  svg{ display:block; width:100%; height:auto; cursor:default; }
  .pad-scale{ cursor:pointer; }
  .pad-scale{ transition: transform .55s cubic-bezier(.34,1.4,.5,1), opacity .35s ease; transform: scale(0); transform-origin:0 0; }
  .pad-scale.grown{ transform: scale(1); }
  .pad-scale.cut{ transform: scale(0); opacity:0; transition: transform .4s ease-in, opacity .4s ease-in; }
  .limb{ transition: stroke-dashoffset .8s ease; }

  .dock{
    margin-top:14px; display:flex; align-items:center; gap:16px;
    background:rgba(255,255,255,.55); backdrop-filter:blur(6px);
    border:1px solid rgba(90,110,80,.14); border-radius:14px; padding:10px 16px;
  }
  .dock .g{ display:flex; align-items:center; gap:8px; font-size:.8rem; color:#6d7c67; }
  input[type=range]{ -webkit-appearance:none; width:110px; height:4px; border-radius:2px; background:rgba(90,110,80,.2); }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px;height:14px;border-radius:50%;background:#7aa85f;cursor:pointer; }
  input[type=range]::-moz-range-thumb{ width:14px;height:14px;border:none;border-radius:50%;background:#7aa85f;cursor:pointer; }
  .sep{ width:1px; height:24px; background:rgba(90,110,80,.16); }
  button{ font-family:inherit; font-size:.8rem; color:#3c4a3a; background:rgba(255,255,255,.7);
    border:1px solid rgba(90,110,80,.2); border-radius:10px; padding:7px 13px; cursor:pointer; }
  button:hover{ border-color:#7aa85f; background:#fff; }
  .count b{ color:#3c4a3a; font-weight:600; }
  .foot{ margin-top:12px; font-size:.74rem; color:#8b9a84; text-align:center; max-width:420px; line-height:1.5; }
</style>
</head>
<body>
  <div class="brand">
    <h1>My Bonsai</h1>
    <p>Grows on its own · click a leafy puff to prune it</p>
  </div>

  <div class="frame">
    <svg id="tree" viewBox="0 0 420 500" aria-label="A small watercolor bonsai">
      <defs>
        <filter id="paint" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
          <feGaussianBlur stdDeviation="0.7"/>
        </filter>
        <filter id="paintSoft" x="-30%" y="-30%" width="160%" height="160%">
          <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
          <feGaussianBlur stdDeviation="0.5"/>
        </filter>
        <radialGradient id="leafGrad" cx="42%" cy="34%" r="72%">
          <stop offset="0%" stop-color="#bfe3a0"/>
          <stop offset="45%" stop-color="#8ec472"/>
          <stop offset="100%" stop-color="#5f9a53"/>
        </radialGradient>
        <linearGradient id="potGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e0956e"/>
          <stop offset="100%" stop-color="#c06b46"/>
        </linearGradient>
        <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
          <feColorMatrix type="saturate" values="0"/></filter>
      </defs>

      <!-- soft ground shadow -->
      <ellipse cx="210" cy="454" rx="96" ry="15" fill="#c3cdb6" opacity="0.55" filter="url(#paintSoft)"/>

      <!-- pot -->
      <g filter="url(#paint)">
        <path d="M138 405 L282 405 L268 452 Q210 462 152 452 Z" fill="url(#potGrad)"/>
        <path d="M130 398 L290 398 L284 412 Q210 420 136 412 Z" fill="#e79f78"/>
        <path d="M150 452 Q210 462 268 452" fill="none" stroke="#a85837" stroke-width="2" opacity="0.4"/>
      </g>
      <!-- soil -->
      <ellipse cx="210" cy="401" rx="72" ry="9" fill="#3d2c1e" filter="url(#paintSoft)"/>

      <!-- tree (sways as a whole) -->
      <g id="sway">
        <g id="limbs"></g>
        <g id="pads"></g>
        <g id="fall"></g>
      </g>

      <rect x="0" y="0" width="420" height="500" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:multiply; pointer-events:none"/>
    </svg>
  </div>

  <div class="dock">
    <div class="g"><span>Growth</span>
      <span style="font-size:.7rem">calm</span>
      <input type="range" id="speed" min="1" max="10" value="6">
      <span style="font-size:.7rem">quick</span>
    </div>
    <div class="sep"></div>
    <button id="reset">Plant a new one</button>
    <div class="sep"></div>
    <div class="g count">Pruned&nbsp;<b id="snips">0</b></div>
  </div>

  <p class="foot">This preview grows in a few seconds. In the finished app it grows at true pace — about one new puff a week — while it hangs quietly at the top of your screen.</p>

<script>
(function(){
  const NS='http://www.w3.org/2000/svg';
  const limbsG=document.getElementById('limbs');
  const padsG=document.getElementById('pads');
  const fallG=document.getElementById('fall');
  const swayG=document.getElementById('sway');
  const snipsEl=document.getElementById('snips');
  const speedEl=document.getElementById('speed');
  let snips=0, timers=[];

  function el(t,a){ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; }
  function mul(s){ return ()=>{ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

  const TRUNK = "M210 402 C 203 362 222 340 202 312 C 186 289 194 266 202 240";
  const LIMBS = [
    { d:"M206 322 C 180 320 158 314 138 306", p:0 },
    { d:"M200 306 C 230 306 258 302 286 296", p:1 },
    { d:"M200 268 C 176 262 158 250 142 240", p:2 },
    { d:"M202 258 C 232 254 262 244 292 238", p:3 },
    { d:"M202 240 C 202 214 204 190 206 168", p:4 },
  ];
  const PADS = [
    { x:132, y:302, s:1.05 },
    { x:288, y:292, s:1.12 },
    { x:138, y:236, s:0.95 },
    { x:296, y:234, s:1.0  },
    { x:207, y:158, s:1.25 },
  ];

  function buildPad(cx,cy,s,rng){
    const pos=el('g',{transform:`translate(${cx},${cy})`});
    const sc =el('g',{class:'pad-scale', filter:'url(#paint)', transform:'scale(0)'});
    sc.style.transform='scale(0)';
    sc.setAttribute('data-s', s);
    sc.appendChild(el('ellipse',{cx:2*s, cy:9*s, rx:34*s, ry:20*s, fill:'#4f8a49', opacity:0.9}));
    const base=[[-14,2,26],[16,4,24],[0,-6,28],[-24,6,18],[26,7,17]];
    base.forEach(([x,y,r],i)=> sc.appendChild(el('circle',{cx:x*s,cy:y*s,r:r*s,fill:'url(#leafGrad)',opacity:0.98})));
    const hi=[[-6,-12,15],[8,-8,12],[-16,-4,9]];
    hi.forEach(([x,y,r])=> sc.appendChild(el('circle',{cx:x*s,cy:y*s,r:r*s,fill:'#c3e7a4',opacity:0.7})));
    for(let i=0;i<4;i++) sc.appendChild(el('circle',{cx:(rng()*40-20)*s,cy:(rng()*24-14)*s,r:2.4*s,fill:'#4f8f47',opacity:0.5}));
    pos.appendChild(sc);
    pos.style.animation=`bob ${3.2+rng()*1.6}s ease-in-out ${rng()*2}s infinite`;
    sc._pos = {cx,cy,s};
    sc.addEventListener('click', ()=>prune(sc));
    return {pos, sc};
  }

  let padEls=[];
  function plant(seed){
    timers.forEach(clearTimeout); timers=[];
    limbsG.innerHTML=''; padsG.innerHTML=''; fallG.innerHTML='';
    padEls=[]; snips=0; snipsEl.textContent='0';
    const rng=mul(seed);

    const trunk=el('path',{d:TRUNK, class:'limb', fill:'none', stroke:'#9c6b3f',
      'stroke-width':14, 'stroke-linecap':'round', filter:'url(#paintSoft)'});
    limbsG.appendChild(trunk);
    const tHi=el('path',{d:TRUNK, fill:'none', stroke:'#b98a5a', 'stroke-width':4,
      'stroke-linecap':'round', opacity:0.6});
    limbsG.appendChild(tHi);

    const limbPaths=[];
    LIMBS.forEach(l=>{
      const p=el('path',{d:l.d, class:'limb', fill:'none', stroke:'#9c6b3f',
        'stroke-width':7, 'stroke-linecap':'round', filter:'url(#paintSoft)'});
      limbsG.appendChild(p); limbPaths.push(p);
    });

    PADS.forEach((pd,i)=>{
      const {pos,sc}=buildPad(pd.x,pd.y, pd.s*(0.92+rng()*0.16), rng);
      padsG.appendChild(pos); padEls[i]=sc;
    });

    function drawIn(path, delay, dur){
      const len=path.getTotalLength();
      path.style.strokeDasharray=len; path.style.strokeDashoffset=len;
      path.style.transition=`stroke-dashoffset ${dur}ms ease`;
      timers.push(setTimeout(()=>{ path.style.strokeDashoffset=0; }, delay));
    }
    const k = 11 - parseInt(speedEl.value);
    const unit = 70*k;
    drawIn(trunk, 0, unit*8);
    tHi.style.strokeDasharray=trunk.style.strokeDasharray;
    tHi.style.strokeDashoffset=trunk.style.strokeDasharray; tHi.style.transition=trunk.style.transition;
    timers.push(setTimeout(()=>tHi.style.strokeDashoffset=0,0));

    LIMBS.forEach((l,i)=> drawIn(limbPaths[i], unit*4 + i*unit*1.6, unit*4));
    PADS.forEach((pd,i)=>{
      timers.push(setTimeout(()=>padEls[i].classList.add('grown'), unit*6 + i*unit*1.6));
    });
  }

  function prune(sc){
    if(sc.classList.contains('cut')) return;
    const {cx,cy,s}=sc._pos;
    sc.classList.remove('grown'); sc.classList.add('cut');
    const rng=mul((cx*13+cy*7)|0);
    for(let i=0;i<7;i++){
      const lf=el('path',{d:'M0 0 q4 -3 8 0 q-4 6 -8 0 Z', fill:'#7db35f', opacity:0.95,
        transform:`translate(${cx},${cy}) rotate(${rng()*360})`});
      fallG.appendChild(lf);
      const dx=(rng()*60-30), dur=900+rng()*700, rot=rng()*360;
      lf.animate([
        {transform:`translate(${cx}px,${cy}px) rotate(0deg)`, opacity:0.95},
        {transform:`translate(${cx+dx}px,${cy+70+rng()*40}px) rotate(${rot}deg)`, opacity:0}
      ],{duration:dur, easing:'ease-in', fill:'forwards'});
      timers.push(setTimeout(()=>lf.remove(), dur));
    }
    snips++; snipsEl.textContent=String(snips);
    timers.push(setTimeout(()=>{ if(sc.parentNode) sc.parentNode.remove(); }, 420));
  }

  let t0=performance.now();
  (function sway(now){
    const t=(now-t0)/1000;
    const a=Math.sin(t*0.6)*1.15 + Math.sin(t*1.31)*0.4;
    swayG.setAttribute('transform', `rotate(${a.toFixed(3)} 210 402)`);
    requestAnimationFrame(sway);
  })(t0);

  const st=document.createElement('style');
  st.textContent='@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}';
  document.head.appendChild(st);

  document.getElementById('reset').addEventListener('click', ()=>plant((Math.random()*1e9)|0));
  plant((Math.random()*1e9)|0);
})();
</script>
</body>
</html>
